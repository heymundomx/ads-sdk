plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.heymundomx.ads.sdk'
    compileSdk = 37
    defaultConfig {
        minSdk 26
        targetSdk 37
        consumerProguardFiles "consumer-rules.pro"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
    publishing {
        singleVariant("release")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    //Primary Ad Networks
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.facebook.android:audience-network-sdk:6.22.0'
    implementation 'com.facebook.infer.annotation:infer-annotation:0.18.0'
    implementation 'com.wortise:android-sdk:1.8.0-beta09'

    //AdMob mediation
    implementation 'com.google.ads.mediation:facebook:6.22.0.0'
    implementation 'com.google.ads.mediation:bidmachine:3.8.0.0'
    implementation 'com.google.ads.mediation:fyber:8.4.7.0'
    implementation 'com.google.ads.mediation:unity:4.20.0.1'

    //GDPR
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}

afterEvaluate {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components["release"]
                groupId = 'com.github.heymundomx'
                artifactId = 'ads-sdk'
                version = '99.3.0'
            }
        }
    }
}